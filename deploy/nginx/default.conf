# Nginx-Konfiguration für itmitkopf.de (Entwurf, noch nicht auf dem Server angewendet).
# Wird in den Container nach /etc/nginx/conf.d/default.conf eingehängt (read-only).
# TLS, HSTS und Security-Header kommen von Traefik (secHeaders@file).

server {
    listen 80 default_server;
    server_name _;

    # git-sync legt den Checkout als Symlink "current" ab; ausgeliefert wird nur public/
    root  /srv/git/current/public;
    index index.html;
    charset utf-8;

    # Datenschutz: keine Zugriffsprotokolle (siehe Datenschutzerklärung)
    access_log off;
    error_log  /dev/stderr warn;

    # Hinter Traefik: keine absoluten Redirects (sonst falscher Host/Port)
    absolute_redirect off;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Alte URLs der bisherigen Website dauerhaft umleiten
    location = /Impressum.html   { return 301 /impressum/; }
    location = /Datenschutz.html { return 301 /datenschutz/; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML: immer gegen den Server prüfen (ETag), damit Änderungen sofort sichtbar sind
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Schriften ändern sich praktisch nie
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # CSS, JS, Bilder: kurz cachen (Dateinamen sind nicht versioniert)
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # keine versteckten Dateien ausliefern
    location ~ /\.(?!well-known) { return 404; }
}
